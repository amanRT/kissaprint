{% import "macros.html" as m %}
<div class="page-layout">
  <div class="accordion">
    {%- for f in faqs %}
    <details{% if loop.first %} open{% endif %}><summary>{{ f.q }}<span class="plus" aria-hidden="true"></span></summary><div class="answer"><p>{{ f.a }}</p></div></details>
    {%- endfor %}
  </div>
  <aside class="aside-card">
    <h2>Didn't find your answer?</h2>
    <p>Our team replies within a few hours, {{ site.hours }}.</p>
    <a class="btn" href="/contact/">Contact us</a>
  </aside>
</div>
