{% import "macros.html" as m %}
<div class="page-layout">
  <form class="form" data-track-form novalidate>
    <label>Order number<input class="input" name="id" placeholder="KP-7XK2QD" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" required></label>
    <label>Email or mobile number used at checkout<input class="input" name="contact" autocomplete="email" maxlength="120" required></label>
    <p class="co-error" role="alert" data-track-error hidden></p>
    <div><button class="btn btn--kiss" type="submit">Track order {{ m.icon("arrow-right", "icon--arrow") }}</button></div>
  </form>
  <aside class="aside-card">
    <h2>Good to know</h2>
    <p>Your order number starts with KP- and is on your order confirmation. Orders are printed and dispatched within {{ site.dispatch }}, and the tracking link appears here as soon as yours ships.</p>
    <a class="btn btn--ghost" href="/shipping/">Shipping &amp; delivery</a>
  </aside>
</div>
