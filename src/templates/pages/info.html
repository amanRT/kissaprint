{% extends "base.html" %}
{% import "macros.html" as m %}
{% block content %}
<div class="wrap">
  <header class="page-hero">
    {{ m.breadcrumbs([("Home", "/"), (crumb, page.path)]) }}
    <h1>{{ heading | emph }}</h1>
    {%- if intro %}
    <p class="lead">{{ intro }}</p>
    {%- endif %}
  </header>
  {% include "content/" ~ slug ~ ".html" %}
</div>
{% endblock %}
